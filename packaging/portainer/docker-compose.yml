# Life Console for Portainer (stack template: packaging/portainer/portainer-template.json).
# Portainer fills the ${VARIABLES} from the template's form. To update: Stacks → life-console → Pull and redeploy.
services:
  app:
    image: ghcr.io/tj-coding/life-console:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://lifeconsole:${POSTGRES_PASSWORD:?set a database password}@db:5432/lifeconsole
      APP_URL: ${APP_URL:-}
      # closed: only the first account (the admin) can sign up; admins open sign-ups in Settings → Sign-ups
      SIGNUPS: ${SIGNUPS:-closed}
      AUTH_PASSWORD: "on"
      BACKUP_DIR: /backups
    ports:
      - "${LC_PORT:-8080}:8080"
    volumes:
      - backups:/backups

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeconsole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
      POSTGRES_DB: lifeconsole
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeconsole -d lifeconsole"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
  backups:
