<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-label="The planner document: tasks, timeline blocks, deadlines, plans, daily logs, settings and plugin data, all in one file per account">
<title>The planner document: tasks, timeline blocks, deadlines, plans, daily logs, settings and plugin data, all in one file per account</title>
<style>
.pg{fill:#0f1216;stroke:#2a313b}.cd{fill:#171b21;stroke:#2a313b}.in{fill:#0f1216;stroke:#2a313b}
.t{fill:#e6e9ee;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.p{fill:#e6e9ee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.m{fill:#9aa4b2;font:13px ui-monospace,"JetBrains Mono",Menlo,monospace}
.k{fill:#2bd4e6;font:600 13px ui-monospace,"JetBrains Mono",Menlo,monospace}
.h{fill:#2bd4e6}.hs{stroke:#2bd4e6}.ib{fill:#5aa2ff}.is{stroke:#5aa2ff}.w{fill:#e5a03a}.ws{stroke:#e5a03a}
.ln{stroke:#2a313b}.mu{stroke:#9aa4b2}.gl{fill:none;stroke:#9aa4b2;stroke-width:1.6}
.band{fill:#e5a03a;fill-opacity:.14;stroke:#e5a03a;stroke-opacity:.5}
.hl{fill:#2bd4e6;fill-opacity:.12}.hli{fill:#5aa2ff;fill-opacity:.14}
@media (prefers-color-scheme: light){
.pg{fill:#f4f5f7;stroke:#d9dde3}.cd{fill:#fff;stroke:#d9dde3}.in{fill:#f4f5f7;stroke:#d9dde3}
.t,.p{fill:#1b1f24}.m{fill:#5d6673}.k{fill:#1f8a63}.h{fill:#1f8a63}.hs{stroke:#1f8a63}.ib{fill:#1f62c9}.is{stroke:#1f62c9}
.w{fill:#a15c00}.ws{stroke:#a15c00}.ln{stroke:#d9dde3}.mu{stroke:#5d6673}.gl{stroke:#5d6673}
.band{fill:#a15c00;stroke:#a15c00}.hl{fill:#1f8a63}.hli{fill:#1f62c9}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="h"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ib"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#9aa4b2"/></marker>
</defs>
<rect class="pg" x=".5" y=".5" width="639" height="371" rx="3"/>
<path class="cd" d="M20 20h566l34 34v312h-600z"/>
<path class="in" d="M586 20v34h34z"/>
<text class="t" x="40" y="52" text-anchor="start">planner.json</text>
<text class="m" x="560" y="52" text-anchor="end">one per account</text>
<line x1="36" y1="74" x2="604" y2="74" class="ln"/>
<text class="k" x="44" y="96" text-anchor="start">todos</text>
<text class="p" x="250" y="96" text-anchor="start">tasks and subtasks</text>
<line x1="36" y1="108" x2="604" y2="108" class="ln"/>
<text class="k" x="44" y="130" text-anchor="start">timeBlocks</text>
<text class="p" x="250" y="130" text-anchor="start">fixed blocks on the timeline</text>
<line x1="36" y1="142" x2="604" y2="142" class="ln"/>
<text class="k" x="44" y="164" text-anchor="start">deadlines</text>
<text class="p" x="250" y="164" text-anchor="start">countdowns</text>
<line x1="36" y1="176" x2="604" y2="176" class="ln"/>
<text class="k" x="44" y="198" text-anchor="start">plans</text>
<text class="p" x="250" y="198" text-anchor="start">visions, goals and milestones</text>
<line x1="36" y1="210" x2="604" y2="210" class="ln"/>
<text class="k" x="44" y="232" text-anchor="start">notes · sleep · …</text>
<text class="p" x="250" y="232" text-anchor="start">logs, keyed by date</text>
<line x1="36" y1="244" x2="604" y2="244" class="ln"/>
<text class="k" x="44" y="266" text-anchor="start">settings</text>
<text class="p" x="250" y="266" text-anchor="start">notifications, timezone</text>
<line x1="36" y1="278" x2="604" y2="278" class="ln"/>
<text class="k" x="44" y="300" text-anchor="start">modules.&lt;id&gt;</text>
<text class="p" x="250" y="300" text-anchor="start">each plugin's own data</text>
<line x1="36" y1="312" x2="604" y2="312" class="ln"/>
<text class="k" x="44" y="334" text-anchor="start">schemaVersion</text>
<text class="p" x="250" y="334" text-anchor="start">which format it is in</text>
</svg>
