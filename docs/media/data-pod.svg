<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Coming next: after each save, Life Console writes the planner to your Solid pod as standard JSON-LD files; sign-in, sessions, notification devices and keys stay on the server">
