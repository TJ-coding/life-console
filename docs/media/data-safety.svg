<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338" role="img" aria-label="Five copies of your planner: the browser copy, the server document, hourly snapshots, daily backups and your own export">
<title>Five copies of your planner: the browser copy, the server document, hourly snapshots, daily backups and your own export</title>
<style>
.pg{fill:#0f1216;stroke:#2a313b}.cd{fill:#171b21;stroke:#2a313b}.in{fill:#0f1216;stroke:#2a313b}
.t{fill:#e6e9ee;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.p{fill:#e6e9ee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.m{fill:#9aa4b2;font:13px ui-monospace,"JetBrains Mono",Menlo,monospace}
.k{fill:#2bd4e6;font:600 13px ui-monospace,"JetBrains Mono",Menlo,monospace}
.h{fill:#2bd4e6}.hs{stroke:#2bd4e6}.ib{fill:#5aa2ff}.is{stroke:#5aa2ff}.w{fill:#e5a03a}.ws{stroke:#e5a03a}
.ln{stroke:#2a313b}.mu{stroke:#9aa4b2}.gl{fill:none;stroke:#9aa4b2;stroke-width:1.6}
.band{fill:#e5a03a;fill-opacity:.14;stroke:#e5a03a;stroke-opacity:.5}
.hl{fill:#2bd4e6;fill-opacity:.12}.hli{fill:#5aa2ff;fill-opacity:.14}
@media (prefers-color-scheme: light){
.pg{fill:#f4f5f7;stroke:#d9dde3}.cd{fill:#fff;stroke:#d9dde3}.in{fill:#f4f5f7;stroke:#d9dde3}
.t,.p{fill:#1b1f24}.m{fill:#5d6673}.k{fill:#1f8a63}.h{fill:#1f8a63}.hs{stroke:#1f8a63}.ib{fill:#1f62c9}.is{stroke:#1f62c9}
.w{fill:#a15c00}.ws{stroke:#a15c00}.ln{stroke:#d9dde3}.mu{stroke:#5d6673}.gl{stroke:#5d6673}
.band{fill:#a15c00;stroke:#a15c00}.hl{fill:#1f8a63}.hli{fill:#1f62c9}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="h"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ib"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#9aa4b2"/></marker>
</defs>
<rect class="pg" x=".5" y=".5" width="639" height="337" rx="3"/>
<rect class="cd" x="60" y="20" width="560" height="50" rx="2"/>
<rect x="60" y="20" width="4" height="50" class="h"/>
<text class="t" x="80" y="50" text-anchor="start">Browser copy</text>
<text class="p" x="270" y="50" text-anchor="start">every edit, at once</text>
<text class="m" x="604" y="50" text-anchor="end">on each device</text>
<rect class="cd" x="60" y="82" width="560" height="50" rx="2"/>
<rect x="60" y="82" width="4" height="50" class="h"/>
<text class="t" x="80" y="112" text-anchor="start">Server document</text>
<text class="p" x="270" y="112" text-anchor="start">~1.5 s later</text>
<text class="m" x="604" y="112" text-anchor="end">versioned: v1, v2, v3…</text>
<rect class="cd" x="60" y="144" width="560" height="50" rx="2"/>
<rect x="60" y="144" width="4" height="50" class="h"/>
<text class="t" x="80" y="174" text-anchor="start">Snapshots</text>
<text class="p" x="270" y="174" text-anchor="start">at most hourly</text>
<text class="m" x="604" y="174" text-anchor="end">last 200 kept</text>
<rect class="cd" x="60" y="206" width="560" height="50" rx="2"/>
<rect x="60" y="206" width="4" height="50" class="h"/>
<text class="t" x="80" y="236" text-anchor="start">Daily backups</text>
<text class="p" x="270" y="236" text-anchor="start">every 24 h</text>
<text class="m" x="604" y="236" text-anchor="end">14 days · 28 before updates</text>
<rect class="cd" x="60" y="268" width="560" height="50" rx="2"/>
<rect x="60" y="268" width="4" height="50" class="ib"/>
<text class="t" x="80" y="298" text-anchor="start">Your export</text>
<text class="p" x="270" y="298" text-anchor="start">whenever you like</text>
<text class="m" x="604" y="298" text-anchor="end">a JSON file you keep</text>
<line x1="32" y1="30" x2="32" y2="314" class="mu" stroke-width="1.5" marker-end="url(#g)"/>
<text class="m" transform="translate(24 172) rotate(-90)" text-anchor="middle">further back</text>
</svg>
