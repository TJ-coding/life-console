# Life Console — self-hosted stack: PostgreSQL + the app + daily backups.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD and APP_URL at least
#   docker compose up -d      # → http://localhost:8080 (the first account you create is the admin)
#
# Update:   docker compose pull && docker compose up -d     (migrations run automatically, after a backup)
#           The `updater` service does this for you: new versions install themselves (auto-update, switchable in
#           Settings → Server updates), or with the "Update now" button. It needs the Docker socket, so it's a
#           locked-down container that can only run that one command. LC_UPDATER=0 in .env turns it off; for a setup
#           where no container holds the socket, see docs/SELF_HOSTING.md §4 (host updater).
# Pin/roll back the app: set LC_VERSION in .env (e.g. sha-1a2b3c4) and `docker compose up -d`.
# Full guide: docs/SELF_HOSTING.md
name: life-console

x-db-env: &db-url
  DATABASE_URL: postgres://${POSTGRES_USER:-lifeconsole}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lifeconsole}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeconsole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lifeconsole}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${LC_IMAGE:-ghcr.io/tj-coding/life-console}:${LC_VERSION:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *db-url
      APP_URL: ${APP_URL:-http://localhost:8080}
      SIGNUPS: ${SIGNUPS:-open}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-on}
      LANDING: ${LANDING:-off}
      ANALYTICS_SCRIPT: ${ANALYTICS_SCRIPT:-}
      ANALYTICS_SITE_ID: ${ANALYTICS_SITE_ID:-}
      ANALYTICS_RECORDER: ${ANALYTICS_RECORDER:-}
      ANALYTICS_DASHBOARD: ${ANALYTICS_DASHBOARD:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_HOSTNAME: ${UMAMI_HOSTNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPSTREAM_ISSUES: ${UPSTREAM_ISSUES:-on}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Life Console <no-reply@localhost>}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # plugins (docs/PLATFORM.md): the vault key for saved connections, and OAuth apps for "Connect Strava" etc.
      VAULT_KEY: ${VAULT_KEY:-}
      REGISTRY_UPSTREAM: ${REGISTRY_UPSTREAM:-}
      OAUTH_STRAVA_CLIENT_ID: ${OAUTH_STRAVA_CLIENT_ID:-}
      OAUTH_STRAVA_CLIENT_SECRET: ${OAUTH_STRAVA_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      BACKUP_DIR: /backups
      # update notices for admins: compares this image's commit with GitHub (UPDATE_CHECK=off stops it)
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
      LC_IMAGE: ${LC_IMAGE:-ghcr.io/tj-coding/life-console}
      LC_VERSION: ${LC_VERSION:-latest}
      UPDATE_DIR: /updates
      AUTO_UPDATE: ${AUTO_UPDATE:-on} # the auto-update switch's starting value; it only acts while the updater runs
      # the extension previewer for AI apps (the `previewer` service below): http://previewer:9222 to use it
      PREVIEWER_URL: ${PREVIEWER_URL:-}
    networks: [default, preview]
    ports:
      # host port; "127.0.0.1:18080" keeps it local when a reverse proxy on the same Docker network serves it
      - "${LC_PORT:-8080}:8080"
    volumes:
      - backups:/backups
      - updates:/updates
    stop_grace_period: 15s

  backup:
    image: ${LC_IMAGE:-ghcr.io/tj-coding/life-console}:${LC_VERSION:-latest}
    build: . # same image as app (lets hosts that build from source, e.g. Dokploy, run it before it's on GHCR)
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    command: ["node", "server/backup.mjs"]
    environment:
      <<: *db-url
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    healthcheck: { disable: true }

  # Updates from inside the app: auto-update (on by default, switchable in Settings → Server updates) and the
  # "Update now" button. LC_UPDATER=0 in .env turns this service off (then update with the commands above, or use
  # the host updater in docs/SELF_HOSTING.md §4, which keeps the socket out of every container).
  # It holds the Docker socket, and whatever holds it can control Docker (root on this host), so it's its own
  # container that does exactly one thing: when the app leaves an update request in the shared `updates` volume,
  # it runs, in this folder (mounted read-only),
  #   docker compose pull app backup && docker compose up -d --wait app backup
  # The app never gets the socket and can't change that command; nothing the app writes is ever read as input.
  # And the container is locked down, so there's little in it to attack: no network (the Docker daemon does the
  # pulling, not the container), a read-only filesystem, no Linux capabilities beyond the three it needs to own
  # and write its shared folder, no privilege escalation, and small memory/process limits.
  updater:
    image: docker:cli
    scale: ${LC_UPDATER:-1}
    restart: unless-stopped
    depends_on: [app] # the app creates the shared volume first, owned by its user
    working_dir: /project
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
      - updates:/updates
    # locked down: it only talks to the local Docker socket and writes to /updates
    network_mode: none
    read_only: true
    tmpfs: [/tmp, /root]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER] # own the shared folder and write the app's files in it, nothing more
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown 1000:1000 /updates 2>/dev/null
        # the same compose project this container belongs to (even if it was started with -p <name>)
        export COMPOSE_PROJECT_NAME="$$(docker inspect "$$(hostname)" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
        [ -n "$$COMPOSE_PROJECT_NAME" ] || { echo "updater: can't tell which compose project this is"; sleep 60; exit 1; }
        echo "updater: watching for update requests from the app (project $$COMPOSE_PROJECT_NAME)"
        while :; do
          echo "{\"at\":$$(date +%s)}" > /updates/updater.json
          if mv /updates/request /updates/request.taken 2>/dev/null; then
            echo "{\"state\":\"running\",\"at\":$$(date +%s)}" > /updates/status.json
            echo "$$(date -u '+%F %T') pulling the new image" > /updates/status.log
            if { docker compose pull app backup && docker compose up -d --no-build --wait --wait-timeout 300 app backup; } >> /updates/status.log 2>&1
            then result=done; else result=failed; fi
            echo "{\"state\":\"$$result\",\"at\":$$(date +%s)}" > /updates/status.json
            echo "update $$result:"; tail -n 20 /updates/status.log
          fi
          sleep 5
        done
    healthcheck: { disable: true }

  # Optional: a headless Chromium that runs extension drafts for AI apps (server/previewer.mjs), so Claude can build
  # and check an extension without your browser open; you open the workshop only to try the result. Off by default:
  # COMPOSE_PROFILES=previewer and PREVIEWER_URL=http://previewer:9222 in .env turn it on (about 1 GB of disk and
  # 200-700 MB of memory while it runs). Drafts are code someone wrote, so it's walled off: no internet (an internal
  # network shared only with the app, not the database), no Linux capabilities, no privilege escalation, memory and
  # process limits, and every run is a throwaway browser profile on demo data.
  previewer:
    image: chromedp/headless-shell:158.0.8127.37
    profiles: [previewer]
    restart: unless-stopped
    networks: [preview]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    mem_limit: 768m
    pids_limit: 256
    healthcheck: { disable: true }

networks:
  default:
  preview:
    internal: true # no route to the internet; only the app and the previewer are on it

volumes:
  db:
  backups:
  updates:
