# Life Console — self-hosted stack: PostgreSQL + the app + daily backups.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD and APP_URL at least
#   docker compose up -d      # → http://localhost:8080 (the first account you create is the admin)
#
# Update:   docker compose pull && docker compose up -d     (migrations run automatically, after a backup)
# Pin/roll back the app: set LC_VERSION in .env (e.g. sha-1a2b3c4) and `docker compose up -d`.
# Full guide: docs/SELF_HOSTING.md
name: life-console

x-db-env: &db-url
  DATABASE_URL: postgres://${POSTGRES_USER:-lifeconsole}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lifeconsole}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeconsole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lifeconsole}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${LC_IMAGE:-ghcr.io/tj-coding/life-console}:${LC_VERSION:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *db-url
      APP_URL: ${APP_URL:-http://localhost:8080}
      SIGNUPS: ${SIGNUPS:-open}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-on}
      LANDING: ${LANDING:-off}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Life Console <no-reply@localhost>}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BACKUP_DIR: /backups
    ports:
      # host port; "127.0.0.1:18080" keeps it local when a reverse proxy on the same Docker network serves it
      - "${LC_PORT:-8080}:8080"
    volumes:
      - backups:/backups
    stop_grace_period: 15s

  backup:
    image: ${LC_IMAGE:-ghcr.io/tj-coding/life-console}:${LC_VERSION:-latest}
    build: . # same image as app (lets hosts that build from source, e.g. Dokploy, run it before it's on GHCR)
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    command: ["node", "server/backup.mjs"]
    environment:
      <<: *db-url
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    healthcheck: { disable: true }

volumes:
  db:
  backups:
