<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Extension preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300..600,0..1&display=swap" rel="stylesheet" />
<style>
/* the console's tokens (src/styles.css) */
:root { --bg:#0e1116; --surface:#161b22; --surface-2:#1f2630; --border:#2a323d; --text:#e6edf3; --muted:#8b96a3; --accent:#2bd4e6; --info:#4c9aff; --warn:#e3b341; --danger:#f25f5c; --on-accent:#0e1116; color-scheme: dark; }
:root[data-theme="light"] { --bg:#f7f7f5; --surface:#fff; --surface-2:#eef0f2; --border:#d9dde2; --text:#1a1f24; --muted:#5f6b77; --accent:#0a7d8c; --info:#2563eb; --warn:#b7791f; --danger:#c53030; --on-accent:#fff; color-scheme: light; }
body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 13px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
h3 { font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.part { border: 1px dashed var(--border); border-radius: 8px; padding: 8px; }
.err { color: var(--danger); white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div id="out"><p style="color:var(--muted)">Waiting for a draft…</p></div>
<script type="module" src="/src/preview/main.js"></script>
</body>
</html>
